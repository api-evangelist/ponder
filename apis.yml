name: Ponder
description: >-
  Ponder was a data-science software company founded by UC Berkeley RISELab researchers
  (Doris Lee, Devin Petersohn, and Prof. Aditya Parameswaran) to commercialize the popular
  open-source Python libraries Modin (a drop-in pandas replacement that scales dataframe
  workflows with a single line of code) and Lux (automated visualization and intelligent
  data discovery inside notebooks). Backed by Lightspeed Venture Partners, 8VC, Intel Capital,
  and The House Fund via a $7M seed in March 2022, Ponder was acquired by Snowflake in October
  2023. The ponder.io domain is now parked and no longer serves a live product, developer
  portal, or API; the open-source libraries remain the durable public surface.
